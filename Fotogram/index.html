<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Fotogram – zwölf Bilder entdecken und in der Großansicht durchblättern."
    >

    <title>Fotogram – Your personal photo album</title>

    <link
        rel="icon"
        type="image/png"
        href="./assets/favicon.png"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #06171e;
            --surface: #09212a;
            --border: #124658;
            --hover: #6bc1e1;
            --pressed: #0d3240;
            --accent: #fd5b4f;
            --text: #ffffff;
            --muted: #99acb3;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body.dialog-open {
            overflow: hidden;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--hover);
            outline-offset: 5px;
        }

        [hidden] {
            display: none !important;
        }


        /* HEADER */

        header {
            min-height: 81px;
            background-color: var(--surface);
        }

        .header-content {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px clamp(24px, 9.72vw, 140px);
        }

        .logo {
            width: max-content;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            text-decoration: none;
        }

        .logo-symbol {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .logo-symbol::before,
        .logo-symbol::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            border: 3px solid var(--accent);
            border-radius: 5px;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .logo-symbol::after {
            width: 10px;
            height: 10px;
            border-color: var(--hover);
        }

        .logo-text {
            font-size: 31px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: -1px;
        }


        /* MAIN */

        main {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 160px 24px;
            flex: 1;
        }

        .album {
            width: 100%;
            max-width: 1194px;
            margin: 0 auto;
        }

        h1 {
            max-width: 799px;
            margin: 0 auto 80px;
            text-align: center;
            font-size: 48px;
            line-height: 50px;
            font-weight: 800;
        }


        /* GALERIE */

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            column-gap: 24px;
            row-gap: 29px;
        }

        .thumbnail {
            width: 150px;
            height: 150px;
            padding: 0;
            flex: 0 0 150px;
            overflow: hidden;
            border: 2px solid var(--border);
            border-radius: 16px;
            background-color: var(--surface);
            color: var(--text);
            transition:
                border-color 100ms ease-out,
                transform 100ms ease-out;
        }

        .thumbnail:hover {
            border-color: var(--hover);
            transform: translateY(-2px);
        }

        .thumbnail:active {
            transform: translateY(0);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .image-error {
            display: block;
            padding: 12px;
            font-size: 14px;
        }


        /* FOOTER */

        footer {
            position: relative;
            min-height: 128px;
            padding: 32px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 15% -40%,
                    rgba(107, 193, 225, 0.25),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 85% 140%,
                    rgba(253, 91, 79, 0.18),
                    transparent 45%
                ),
                var(--surface);
        }

        .footer-content {
            position: relative;
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }

        .footer-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 700;
        }

        .footer-logo-symbol {
            width: 28px;
            height: 28px;
            border: 3px solid var(--accent);
            border-radius: 5px;
            transform: rotate(45deg);
        }

        footer p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }


        /* DIALOG */

        dialog {
            width: min(688px, calc(100% - 32px));
            height: 675px;
            max-height: calc(100dvh - 32px);
            margin: auto;
            padding: 0;
            overflow: auto;
            border: 0;
            border-radius: 40px;
            background-color: var(--surface);
            color: var(--text);
        }

        dialog::backdrop {
            background-color: rgb(0 0 0 / 70%);
        }

        .dialog-content {
            height: 100%;
            min-height: 400px;
            padding: 56px 64px;
            display: grid;
            grid-template-rows: 32px minmax(100px, 1fr) 60px;
            gap: 48px;
        }

        .dialog-header {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .dialog-title {
            min-width: 0;
            margin: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 24px;
        }

        .close-button {
            width: 32px;
            height: 32px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 0;
            border-radius: 100px;
            background-color: transparent;
            color: white;
        }

        .close-button:hover {
            background-color: var(--border);
        }

        .close-button:active {
            background-color: var(--pressed);
        }

        .icon {
            width: 24px;
            height: 24px;
            display: block;
            pointer-events: none;
        }

        .image-container {
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .large-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .image-status {
            color: var(--muted);
            text-align: center;
        }


        /* NAVIGATION */

        .navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 56px;
        }

        .arrow-button {
            width: 60px;
            height: 60px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 0;
            border-radius: 100px;
            background-color: rgb(253 91 79 / 10%);
            color: white;
        }

        .arrow-button:hover {
            background-color: rgb(253 91 79 / 20%);
        }

        .arrow-button:active {
            background-color: rgb(253 91 79 / 30%);
        }

        .previous .icon {
            transform: rotate(180deg);
        }

        .counter {
            min-width: 48px;
            flex-shrink: 0;
            text-align: center;
            font-size: 16px;
        }

        dialog button:focus-visible {
            outline-color: white;
        }


        /* RESPONSIVE */

        @media (min-width: 1600px) {
            h1 {
                margin-bottom: 160px;
            }
        }

        @media (max-width: 1000px) {
            main {
                padding: 80px 24px;
            }

            h1 {
                margin-bottom: 56px;
                font-size: 44px;
            }
        }

        @media (max-width: 600px) {
            header {
                min-height: 80px;
            }

            .header-content {
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0 16px;
            }

            .logo-symbol {
                width: 32px;
                height: 32px;
            }

            .logo-text {
                font-size: 25px;
            }

            main {
                padding: 40px 16px 48px;
            }

            h1 {
                max-width: 266px;
                margin: 0 auto 56px;
                font-size: 40px;
                line-height: 1.05;
            }

            .gallery {
                width: 324px;
                max-width: 100%;
                margin: 0 auto;
                column-gap: 24px;
                row-gap: 29px;
            }

            footer {
                min-height: 103px;
                padding: 24px 16px;
            }

            .footer-logo {
                font-size: 18px;
            }

            .footer-logo-symbol {
                width: 22px;
                height: 22px;
            }

            dialog {
                height: 664px;
            }

            .dialog-content {
                min-height: 350px;
                padding: 32px 22px;
                grid-template-rows: 69px minmax(100px, 1fr) 60px;
            }

            .dialog-header {
                position: relative;
                display: block;
                padding-top: 40px;
            }

            .close-button {
                position: absolute;
                top: 0;
                right: 0;
            }

            .navigation {
                width: 261px;
                max-width: 100%;
                margin: 0 auto;
                justify-content: space-between;
                gap: 0;
            }

            .large-image {
                object-fit: cover;
            }
        }

        @media (max-width: 347px) {
            .thumbnail {
                width: calc((100% - 16px) / 2);
                height: auto;
                flex-basis: calc((100% - 16px) / 2);
                aspect-ratio: 1;
            }

            h1 {
                font-size: 34px;
            }

            .dialog-content {
                padding-right: 16px;
                padding-left: 16px;
            }
        }

        @media (max-height: 600px) {
            .dialog-content {
                min-height: 280px;
                padding-top: 20px;
                padding-bottom: 20px;
                gap: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .thumbnail {
                transition: none;
            }
        }
    </style>

    <script src="./script.js" defer></script>

</head>

<body onload="init()">

    <header>
        <div class="header-content">

            <a
                class="logo"
                href="./index.html"
                aria-label="Fotogram Startseite"
            >
                <span
                    class="logo-symbol"
                    aria-hidden="true"
                ></span>

                <span class="logo-text">
                    Fotogram
                </span>
            </a>

        </div>
    </header>


    <main>

        <section
            class="album"
            aria-labelledby="albumTitle"
        >

            <h1 id="albumTitle" lang="en">
                Your personal photo album
            </h1>

            <div
                id="gallery"
                class="gallery"
            ></div>

            <noscript>
                Bitte aktiviere JavaScript, um die Fotogalerie anzuzeigen.
            </noscript>

        </section>

    </main>


    <footer>

        <div class="footer-content">

            <div class="footer-logo">

                <span
                    class="footer-logo-symbol"
                    aria-hidden="true"
                ></span>

                <span>
                    Developer Akademie
                </span>

            </div>

            <p>
                © 2023 Developer Akademie GmbH
            </p>

        </div>

    </footer>


    <dialog
        id="photoDialog"
        aria-labelledby="dialogTitle"
        onclose="dialogClosed()"
        onkeydown="handleKey(event)"
        onclick="closeOnBackground(event)"
    >

        <div class="dialog-content">

            <div class="dialog-header">

                <h2
                    id="dialogTitle"
                    class="dialog-title"
                ></h2>

                <button
                    type="button"
                    class="close-button"
                    aria-label="Großansicht schließen"
                    onclick="closeDialog()"
                >

                    <img
                        class="icon"
                        src="./assets/close.png"
                        alt=""
                    >

                </button>

            </div>


            <div
                class="image-container"
                id="imageContainer"
            ></div>


            <div class="navigation">

                <button
                    type="button"
                    class="arrow-button previous"
                    aria-label="Vorheriges Bild"
                    onclick="changePhoto(-1)"
                >

                    <img
                        class="icon"
                        src="./assets/Arrow-Right.png"
                        alt=""
                    >

                </button>


                <span
                    id="counter"
                    class="counter"
                ></span>


                <button
                    type="button"
                    class="arrow-button"
                    aria-label="Nächstes Bild"
                    onclick="changePhoto(1)"
                >

                    <img
                        class="icon"
                        src="./assets/Arrow-Right.png"
                        alt=""
                    >

                </button>

            </div>

        </div>

    </dialog>

</body>

</html>
